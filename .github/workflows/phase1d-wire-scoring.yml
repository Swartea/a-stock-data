name: phase1d-wire-scoring

on:
  push:
    branches: [phase0-ci-stabilization]
    paths:
      - .github/workflows/phase1d-wire-scoring.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase0-ci-stabilization
          fetch-depth: 0

      - name: Wire scoring module into pipeline
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('analysis/pipeline.py')
          text = path.read_text(encoding='utf-8')

          anchor = 'from analysis.analytics.scope import _classify_north_scope\n'
          import_line = 'from analysis.analytics.scoring import _build_scoring_breakdown\n'
          if import_line not in text:
              if text.count(anchor) != 1:
                  raise SystemExit(f'import anchor count != 1: {text.count(anchor)}')
              text = text.replace(anchor, anchor + import_line, 1)

          start_marker = (
              '\n# ============================================================\n'
              '# 痛 7 修法 (报告质量债 2.0 批次 C, 2026-09-14): 5 维评分构成\n'
          )
          end_marker = '\n# V2 内嵌 10 类 + V3 追加: 融资融券 + 研报/公告/财务/新闻\n'
          if text.count(start_marker) != 1:
              raise SystemExit(f'scoring start marker count != 1: {text.count(start_marker)}')
          if text.count(end_marker) != 1:
              raise SystemExit(f'scoring end marker count != 1: {text.count(end_marker)}')

          start = text.index(start_marker)
          end = text.index(end_marker, start)
          text = text[:start] + end_marker + text[end + len(end_marker):]

          if '_SCORING_BREAKDOWN_GROUPS = (' in text:
              raise SystemExit('local scoring group definition still present')
          if '_SCORE_DIM_MAX = {' in text:
              raise SystemExit('local score max definition still present')
          if 'def _build_scoring_breakdown(' in text:
              raise SystemExit('local scoring function definition still present')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate minimal cutover
        run: |
          git diff --check
          git diff -- analysis/pipeline.py
          python -m py_compile analysis/pipeline.py analysis/analytics/scoring.py
          PYTHONPATH=. python - <<'PY'
          import ast
          from pathlib import Path
          from analysis.analytics.scoring import _build_scoring_breakdown

          text = Path('analysis/pipeline.py').read_text(encoding='utf-8')
          tree = ast.parse(text)
          local_defs = {
              node.name for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          assert '_build_scoring_breakdown' not in local_defs
          assert any(
              isinstance(node, ast.ImportFrom)
              and node.module == 'analysis.analytics.scoring'
              and any(alias.name == '_build_scoring_breakdown' for alias in node.names)
              for node in tree.body
          )

          sample = {
              'trend': 1, 'valuation': 2, 'valuation_pctile': 3,
              'capital': 7, 'momentum': 1, 'sentiment': 4, 'risk': 4,
              'chip': 4, 'sw_stability': 5, 'dragon': 3, 'total': 34,
          }
          bd = _build_scoring_breakdown(sample)
          assert bd['total'] == {'label': '综合', 'score': 34.0, 'max': 100, 'pct': 34.0}
          assert sum(bd[k]['score'] for k in ('tech', 'capital', 'valuation', 'sentiment', 'risk')) == 34.0
          print('scoring cutover assertions: ok')
          PY

      - name: Commit cutover and remove helper workflow
        run: |
          git config user.name "Swartea"
          git config user.email "131281605+Swartea@users.noreply.github.com"
          git add analysis/pipeline.py
          git rm .github/workflows/phase1d-wire-scoring.yml
          git diff --cached --check
          git commit -m "refactor(pipeline): wire scoring analytics module"
          git push origin HEAD:phase0-ci-stabilization
