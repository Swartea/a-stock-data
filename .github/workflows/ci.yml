name: CI

on:
  push:
    branches: [main, develop, "v*.*", phase0-ci-stabilization]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# 取消同分支在跑的旧 job
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,dev]"

      - name: Critical Ruff gate
        run: |
          # Phase 0 棕地门禁：只硬拦截语法/未定义名称等高风险错误。
          # 现有数百条历史样式债务继续完整输出到诊断文件，不在本 PR 批量改动。
          ruff check analysis tests --select=E9,F63,F7,F82

      - name: Full Ruff diagnostics (advisory)
        if: always()
        run: |
          mkdir -p reports
          ruff check analysis tests --output-format=concise > reports/ruff-full.txt 2>&1 || true

      - name: Black diagnostics (advisory)
        if: always()
        run: |
          black --check analysis tests > reports/black.txt 2>&1 || true

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: |
            reports/ruff-full.txt
            reports/black.txt
          retention-days: 7

  typecheck:
    name: MyPy (渐进式)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,dev]"

      - name: MyPy
        run: mypy analysis --ignore-missing-imports

  test:
    name: pytest ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,dev]"

      - name: Pytest
        env:
          DA_A_DATA_DIR: ${{ github.workspace }}
          # 兼容当前代码中的历史裸 import（quant_analyzer_v3 / html_report_v3 / sections）。
          # Phase 1 再统一收口为 analysis.* 包导入。
          PYTHONPATH: ${{ github.workspace }}/analysis:${{ github.workspace }}
        run: |
          pytest tests/ -v --tb=short -ra \
            --junitxml=reports/ci-junit-${{ matrix.os }}-py${{ matrix.python-version }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/ci-junit-*.xml
          retention-days: 14

  smoke:
    name: Smoke test (600693 东百集团, 2-3 分钟)
    runs-on: macos-latest
    needs: test
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Smoke test 600693
        env:
          DA_A_DATA_DIR: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}/analysis:${{ github.workspace }}
        run: |
          set -o pipefail
          # 端到端冒烟: 使用 Actions 当前 Python 环境运行完整 V3 流程。
          python analysis/quant_analyzer_v3.py 600693 东百集团 \
            2>&1 | tail -20

          day_dir="reports/600693_东百集团/$(date +%Y-%m-%d)"
          test -d "$day_dir" || { echo "✗ 当日报告目录不存在: $day_dir"; exit 1; }

          # 与 pipeline._emit 契约对齐：3 个必需交付物必须成功。
          for pattern in '*.md' 'result_v3-*.json' 'run_log-*.json'; do
            if compgen -G "$day_dir/$pattern" > /dev/null; then
              echo "✓ 必需件 $pattern 落盘"
            else
              echo "✗ 必需件 $pattern 缺失"
              exit 1
            fi
          done

          # HTML / DOCX / PDF 属于允许降级的可选交付物，只记录状态，不阻断 CI。
          for pattern in '*.html' '*.docx' '*.pdf'; do
            if compgen -G "$day_dir/$pattern" > /dev/null; then
              echo "✓ 可选件 $pattern 落盘"
            else
              echo "⚠ 可选件 $pattern 未生成（允许降级，状态应写入 result/run_log）"
            fi
          done

          # failed 才表示核心交付失败；partial 表示至少一个可选件降级。
          latest=$(ls -t "$day_dir"/result_v3-*.json | head -1)
          python -c "import json; d=json.load(open('${latest}', encoding='utf-8')); s=d.get('deliverable_status'); rf=d.get('_files',{}).get('status',{}).get('required_failed',[]); assert s in ('complete','partial'), s; assert not rf, rf; print('deliverable_status=', s, 'required_failed=', rf)"

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-600693
          path: |
            reports/600693_东百集团/*/600693-*.md
            reports/600693_东百集团/*/600693-*.html
            reports/600693_东百集团/*/600693-*.docx
            reports/600693_东百集团/*/600693-*.pdf
            reports/600693_东百集团/*/result_v3-*.json
            reports/600693_东百集团/*/run_log-*.json
          retention-days: 7
