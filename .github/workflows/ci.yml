name: CI

on:
  push:
    branches: [main, develop, "v*.*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# 取消同分支在跑的旧 job
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,dev]"

      - name: Ruff check
        run: |
          ruff check analysis tests

      - name: Black --check
        run: |
          black --check analysis tests

      - name: MyPy (only on ubuntu + py3.12, 渐进式)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          mypy analysis --ignore-missing-imports || true
        continue-on-error: true

      - name: Pytest
        env:
          # CI 环境用 repo 根目录, 不依赖个人路径 (P1-E 规范)
          DA_A_DATA_DIR: ${{ github.workspace }}
        run: |
          pytest tests/ -v --tb=short -ra \
            --junitxml=reports/ci-junit-${{ matrix.os }}-py${{ matrix.python-version }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/ci-junit-*.xml
          retention-days: 14

  smoke:
    name: Smoke test (600693 东百集团, 2-3 分钟)
    runs-on: macos-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'push'
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Smoke test 600693
        env:
          DA_A_DATA_DIR: ${{ github.workspace }}
        run: |
          # 端到端冒烟: 跑 600693 验证 6 件套完整
          bash scripts/run_in_venv.sh analysis/quant_analyzer_v3.py 600693 东百集团 \
            2>&1 | tail -20
          # 验证 6 件套落盘
          day_dir=reports/600693_东百集团/$(date +%Y-%m-%d)
          for f in .md .docx .pdf result_v3-*.json run_log-*.json; do
            if ls reports/600693_东百集团/2026-09-*/${f} 2>/dev/null | head -1 > /dev/null; then
              echo "✓ ${f} 落盘"
            else
              echo "✗ ${f} 缺失"
              exit 1
            fi
          done
          # 验证 deliverable_status = complete
          latest=$(ls -t reports/600693_东百集团/2026-09-*/result_v3-*.json | head -1)
          python -c "import json; d=json.load(open('${latest}')); assert d.get('deliverable_status')=='complete', d.get('deliverable_status')"

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-600693
          path: |
            reports/600693_东百集团/2026-09-*/600693-*.{md,html,docx,pdf}
            reports/600693_东百集团/2026-09-*/{result_v3-*,run_log-*}*.json
          retention-days: 7
