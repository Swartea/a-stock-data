name: CI

on:
  push:
    branches: [main, develop, "v*.*", phase0-ci-stabilization]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# 取消同分支在跑的旧 job
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,dev]"

      - name: Ruff check
        run: ruff check analysis tests

      - name: Black --check
        run: black --check analysis tests

  typecheck:
    name: MyPy (渐进式)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,dev]"

      - name: MyPy
        run: mypy analysis --ignore-missing-imports

  test:
    name: pytest ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,dev]"

      - name: Pytest
        env:
          DA_A_DATA_DIR: ${{ github.workspace }}
        run: |
          pytest tests/ -v --tb=short -ra \
            --junitxml=reports/ci-junit-${{ matrix.os }}-py${{ matrix.python-version }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/ci-junit-*.xml
          retention-days: 14

  smoke:
    name: Smoke test (600693 东百集团, 2-3 分钟)
    runs-on: macos-latest
    needs: [test, typecheck]
    if: github.event_name == 'push'
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Smoke test 600693
        env:
          DA_A_DATA_DIR: ${{ github.workspace }}
        run: |
          # 端到端冒烟: 跑 600693 验证 6 件套完整
          bash scripts/run_in_venv.sh analysis/quant_analyzer_v3.py 600693 东百集团 \
            2>&1 | tail -20

          # 验证当日目录与 6 件套落盘，不写死年月
          day_dir="reports/600693_东百集团/$(date +%Y-%m-%d)"
          test -d "$day_dir" || { echo "✗ 当日报告目录不存在: $day_dir"; exit 1; }

          for pattern in '*.md' '*.html' '*.docx' '*.pdf' 'result_v3-*.json' 'run_log-*.json'; do
            if compgen -G "$day_dir/$pattern" > /dev/null; then
              echo "✓ $pattern 落盘"
            else
              echo "✗ $pattern 缺失"
              exit 1
            fi
          done

          # 验证 deliverable_status = complete
          latest=$(ls -t "$day_dir"/result_v3-*.json | head -1)
          python -c "import json; d=json.load(open('${latest}', encoding='utf-8')); assert d.get('deliverable_status')=='complete', d.get('deliverable_status')"

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-600693
          path: |
            reports/600693_东百集团/*/600693-*.md
            reports/600693_东百集团/*/600693-*.html
            reports/600693_东百集团/*/600693-*.docx
            reports/600693_东百集团/*/600693-*.pdf
            reports/600693_东百集团/*/result_v3-*.json
            reports/600693_东百集团/*/run_log-*.json
          retention-days: 7
