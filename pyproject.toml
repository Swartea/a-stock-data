[project]
name = "da-a-data"
version = "0.16.0"
description = "A 股多因子量化分析器 V3 — 报告主分析器 (V3.7.2 era 报告层升级)"
readme = "docs/00-项目总览.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Swartea"}
]
keywords = ["quant", "a-stock", "report", "valuation", "multi-factor"]

# 运行时依赖 (必须属于 [project]；否则 pip install -e . 不会安装)
dependencies = [
    "requests>=2.30,<3.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.0,<7.0",
    "openpyxl>=3.1,<4.0",
    "numpy>=1.24,<3.0",
    "pandas>=2.0,<3.0",
    "baostock>=0.9,<1.0",        # K 线 (前复权, V2 筹码)
    "mootdx>=0.10,<1.0",         # 通达信本地行情 (备用)
    "python-docx>=1.1,<2.0",     # DOCX 渲染
    "truststore>=0.8,<1.0",      # 申万表 SSL：走系统信任库（证书链缺中间证书）
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=4.0,<7.0",
    "pytest-mock>=3.10,<4.0",
]
dev = [
    "ruff>=0.5,<1.0",            # 静态检查
    "black>=24.0,<26.0",         # 格式化
    "mypy>=1.10,<2.0",           # 类型检查
]

[project.scripts]
da-a-analyze = "analysis.quant_analyzer_v3:main"

# 自动发现 analysis 下的子包，避免 wheel/正式安装漏掉 analysis.sections.*
[tool.setuptools.packages.find]
include = ["analysis*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ============================================================
# pytest 配置
# ============================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "-ra",
    # 默认不选 `live` 用例 (实时行情/网络)。这是 live gate 的第一步 (默认值):
    #   普通 `pytest` → live 用例 deselected, 即使 DA_A_RUN_LIVE=1 也不碰网络
    # 关键: 命令行任意 `-m` 会**完全覆盖**这里的 `-m "not live"` (后写的 -m 生效),
    # 所以这行本身不是门禁, 只是可被覆盖的默认值。真正的第一步门禁在
    # tests/conftest.py 的 `pytest_collection_modifyitems` —— live 用例只有被生效的
    # -m 表达式**正向点名** (live / integration) 才留在 items 里, 其余一律 deselect。
    # 因此 `DA_A_RUN_LIVE=1 pytest -m "not slow"` 不会把 live 用例选回来。
    # 第二步 (跑不跑) 仍是用例自己的 skipif: DA_A_RUN_LIVE 精确等于 "1" 才放行。
    # 只排除 `live` 而不是排除整个 `integration`: 仓库里另有一个 integration 用例
    # (tests/reporting/test_artifact_delivery_contract.py 的 LibreOffice 转换) 不打网络,
    # 它的选取/执行语义保持原样, 不被这道门禁误伤。
    "-m", "not live",
]
# 收集时忽略的目录
norecursedirs = [
    ".git", ".tox", "venv", "reports",
    "analysis/sections", "analysis/templates",
]
# 自定义标记 (后续可加)
markers = [
    "slow: 慢测试 (端到端 + 网络)",
    "integration: 集成测试 (需真实数据源)",
    "live: 实时行情/网络用例 (默认不选; 需 -m 显式点名 live/integration 且 DA_A_RUN_LIVE=1)",
    "unit: 单元测试 (mock + fixture)",
]
filterwarnings = [
    "ignore::DeprecationWarning:baostock.*",
    "ignore::DeprecationWarning:mootdx.*",
]

# ============================================================
# ruff 配置
# ============================================================
[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    "venv",
    "reports",
    "tests/sections",
    "analysis/sections",
    "analysis/templates",
]

[tool.ruff.lint]
# 与项目规范对齐: §3 显式/§5 安全/§7 报告/§8 日志
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
]
# 显式排除: 框架常规/可控异常
ignore = [
    "E501",  # line-too-long (项目内一行有时很长, 跟 §3 注释冲突)
    "B904",  # raise from (V3 大量 except Exception: pass 模式)
    "B008",  # function call in default argument
    "C901",  # function complexity (V3 单文件函数长)
]

[tool.ruff.lint.isort]
known-first-party = ["analysis", "tests"]

[tool.ruff.lint.per-file-ignores]
# 安全相关: verify=False 在 v3 已被禁 (P0-C), 但脚本/section 仍可能有
"scripts/*.py" = ["E402", "F401"]
"analysis/sections/*.py" = ["E402", "F401", "F811"]
"tests/*.py" = ["E402", "F401", "F811", "B011"]

# ============================================================
# black 配置 (项目代码风格)
# ============================================================
[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
(
    venv
    | reports
)
'''

# ============================================================
# mypy 配置
# ============================================================
[tool.mypy]
# 类型检查以开发/CI 实际解释器 3.12 为准 (venv = Python 3.12):
# numpy 类型存根 (numpy/__init__.pyi) 使用 3.12 的 type 语句,
# 若按 requires-python 下限 3.10 检查会直接 syntax error, 一行都查不到。
# requires-python >=3.10 约束的是运行兼容性, 由 pytest/ruff 保障;
# mypy 的目标是真实跑完并报告错误, 故与 venv 解释器保持一致。
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
# 项目不强制 (渐进式):
ignore_missing_imports = true
ignore_errors = false
# 排除 (P0-C 后我们保持 verify=False 不在 v3 出现, 但 v2 旧代码可能)
exclude = [
    "venv",
    "reports",
    "tests/sections",
    "analysis/sections",
]
